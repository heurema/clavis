<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap">
  <style>

body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Source Sans 3", sans-serif; color: #1c1917; -webkit-font-smoothing: antialiased; }
a { color: #1c1917; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: #a8a29e; } a:hover { text-decoration-color: #1c1917; }
.root { width: 1440px; background: #fbfaf8; display: flex; flex-direction: column; }
.top { height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 64px; box-sizing: border-box; border-bottom: 1px solid #e7e5e4; }
.word { font-family: "Instrument Serif", Georgia, "Times New Roman", serif; font-size: 26px; letter-spacing: -0.01em; }
.links { display: flex; gap: 28px; font-size: 14px; color: #57534e; align-items: center; }
.links .on { color: #1c1917; font-weight: 500; }
.wrap { width: 1040px; margin: 0 auto; padding: 56px 0 72px; display: flex; flex-direction: column; gap: 48px; }
h1 { margin: 0; font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 40px; line-height: 1.1; letter-spacing: -0.01em; }
.lede { margin: 12px 0 0; font-size: 16px; line-height: 24px; color: #57534e; max-width: 560px; }
section { display: flex; flex-direction: column; gap: 16px; }
h2 { margin: 0; font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 26px; display: flex; align-items: baseline; gap: 10px; }
h2 .n { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; color: #a8a29e; font-variant-numeric: tabular-nums; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th { text-align: left; font-weight: 500; font-size: 13px; color: #78716c; padding: 0 0 10px; border-bottom: 1px solid #1c1917; }
td { padding: 14px 0; border-bottom: 1px solid #e7e5e4; vertical-align: top; }
td.k { font-weight: 500; }
td.m { color: #78716c; }
td.num { font-variant-numeric: tabular-nums; }
.bad { color: #b91c1c; }
.tag { font-size: 13px; color: #57534e; border: 1px solid #d6d3d1; border-radius: 999px; padding: 1px 9px; margin-right: 6px; white-space: nowrap; }
.btn { height: 40px; padding: 0 18px; border-radius: 4px; font-size: 15px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-sizing: border-box; border: 1px solid #1c1917; }
.btn.p { background: #1c1917; color: #fbfaf8; }
.btn.o { background: transparent; color: #1c1917; }
.field { display: flex; flex-direction: column; gap: 8px; }
label { font-size: 14px; font-weight: 500; }
.in { height: 42px; border: 1px solid #a8a29e; border-radius: 4px; background: #ffffff; padding: 0 12px; font-size: 16px; display: flex; align-items: center; box-sizing: border-box; }
.in.pw { letter-spacing: .2em; }
.small { font-size: 13px; color: #78716c; margin: 0; line-height: 20px; }
.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; justify-content: space-between; padding: 18px 0; border-bottom: 1px solid #e7e5e4; font-size: 16px; }
.row:first-child { border-top: 1px solid #1c1917; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; background: #f0eeeb; padding: 2px 6px; border-radius: 3px; }

  </style>
</helmet>

<div class="root" style="min-height: 720px">
  <header class="top"><span class="word">Clavis</span><nav class="links"><span class="on">Status</span><span>Sign in</span><span>Dark</span></nav></header>
  <div style="width: 640px; margin: 0 auto; padding-top: 72px; display: flex; flex-direction: column; gap: 28px">
    <div style="display: flex; align-items: flex-end; justify-content: space-between">
      <div><h1>Status</h1><p class="lede" style="font-size: 15px">Checked when this page opens.</p></div>
      <span class="btn o" style="height: 36px; font-size: 14px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M8 16H3v5"></path></svg>Retry</span>
    </div>
    <div class="rows">
      <div class="row"><span>Clavis server</span><span>Reachable</span></div>
      <div class="row"><span>Platform database</span><span class="bad">Unavailable</span></div>
    </div>
    <p style="margin: 0; font-size: 15px; line-height: 24px; color: #57534e">The server is reachable, but its platform database is not responding. Start the database, then retry. The same check runs in the terminal with <code>clavis doctor</code>.</p>
  </div>
</div>
</x-dc>
</body>
</html>
