version: "2"
sql:
  - engine: postgresql
    schema: internal/database/migrations
    queries: internal/database/queries
    gen:
      go:
        package: sqlc
        out: internal/database/sqlc
        sql_package: pgx/v5
        omit_unused_structs: true
        overrides:
          - db_type: timestamptz
            go_type:
              import: time
              type: Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: uuid
            go_type: string
          - db_type: text
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: pg_catalog.int4
            nullable: true
            go_type:
              type: int32
              pointer: true
