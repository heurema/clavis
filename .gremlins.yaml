silent: false
unleash:
  integration: false
  dry-run: false
  workers: 2
  # v0.6.0 emits an invalid single argument "-cpu 1" for nonzero values.
  # The wrapper sets GOMAXPROCS=1 instead.
  test-cpu: 0
  timeout-coefficient: 3
  threshold:
    efficacy: 0
    mutant-coverage: 0
  exclude-files:
    - '(^|/)cmd/'
    - '(^|/)internal/(buildinfo|database)/'
    - '(^|/)internal/web/(ui|testdata)/'
    - '(_test|_gen|_templ|\.gen)\.go$'
    - '(^|/)(generated|sqlc)/'
