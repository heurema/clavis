{{- include "clavis.validate" . -}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "clavis.fullname" . }}
  labels:
    {{- include "clavis.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  # TLS terminates here, so publicURL must name the same origin.
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    # An empty host matches every request that reaches the controller.
    {{- if .Values.ingress.host }}
    - host: {{ .Values.ingress.host | quote }}
      http:
    {{- else }}
    - http:
    {{- end }}
        paths:
          - path: {{ .Values.ingress.path | quote }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "clavis.fullname" . }}
                port:
                  name: http
{{- end }}
