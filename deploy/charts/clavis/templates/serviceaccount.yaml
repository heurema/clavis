{{- include "clavis.validate" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "clavis.serviceAccountName" . }}
  labels:
    {{- include "clavis.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The server calls no Kubernetes API, so no token is projected into the pod.
# The Deployment repeats this on the pod, where the kubelet actually reads it.
automountServiceAccountToken: false
