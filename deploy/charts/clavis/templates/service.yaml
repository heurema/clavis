{{- include "clavis.validate" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clavis.fullname" . }}
  labels:
    {{- include "clavis.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    # The container port is fixed by the image, so routes name the port rather
    # than repeating the number.
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "clavis.selectorLabels" . | nindent 4 }}
